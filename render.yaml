services:
  - type: web
    name: ubnd-ai-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /hello-check
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_BASE_URL
        value: https://ubnd-ai-backend.onrender.com
      - key: VITE_API_BASE_URL
        value: ""
